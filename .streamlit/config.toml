[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#f6f8fc"
secondaryBackgroundColor = "#e9eef7"
textColor = "#17243b"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1
maxMessageSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
